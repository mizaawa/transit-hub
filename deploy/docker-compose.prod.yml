# TransitHub 生产部署示例。
# 部署前必须修改所有 change-this-* 占位值，并确认镜像地址和版本号正确。
#
# 本仓库为自维护版本，默认不发布公共镜像。请先按 README「自行构建镜像」一节
# 在本机构建出 transithub:local，再执行 docker compose up。

# 显式声明项目名，不要依赖「目录名」这个隐式默认值。
# 未声明时项目名会回退成目录名 deploy，这会带来两个问题：
#   1. 同目录下的 docker-compose.yml（开发依赖）也叫 deploy，两者服务名同为
#      postgres/redis，于是启动开发依赖会把生产容器按开发配置重建，且把 app 判为孤儿；
#   2. 宿主机上任何其它带 com.docker.compose.project=deploy 标签的容器都会被
#      当作本项目的孤儿容器，触发 "Found orphan containers" 警告，
#      一旦误用 --remove-orphans 就会把那些无关容器删掉。
name: transithub-prod

services:
  # TransitHub 应用服务：包含 Go 后端和已构建的前端静态文件。
  app:
    # 默认使用本地自行构建的镜像。如果你把镜像推到了自己的仓库，
    # 请改成带固定版本号的地址，例如 ghcr.io/mizaawa/transithub:v0.1.15。
    # 不要使用 :latest，否则无法确定线上实际运行的是哪个版本。
    image: transithub:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # 左侧 5478 是宿主机访问端口，可按需修改；右侧 5478 是容器内服务端口。
      - "5478:5478"
    environment:
      PORT: "5478"
      # PostgreSQL 连接串。这里的密码必须和 postgres.POSTGRES_PASSWORD 保持一致。
      DATABASE_URL: postgres://transithub:change-this-db-password@postgres:5432/transithub?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      # 首次空库启动时自动创建的管理员账号。已有用户时不会覆盖密码。
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: change-this-admin-password
      # 生产环境建议关闭公开注册，只允许使用初始化管理员登录。
      ALLOW_PUBLIC_REGISTER: "false"
      # 工单图片附件本地存储目录，必须和下方 volumes 挂载的容器内路径完全一致，
      # 否则容器重建后图片文件会丢失（数据库里的附件 metadata 不受影响）。
      TICKET_UPLOAD_DIR: /app/data/ticket-uploads
      # 可选：SMTP 密码加密密钥，仅当需要在「系统设置 - 邮件设置」中保存 SMTP 密码或发送测试邮件时才需要配置。
      # 缺失不影响应用启动，也不影响 SMTP 之外的功能。用 `openssl rand -base64 32` 生成一个 base64 编码的
      # 32 字节随机值；生成后必须长期稳定保存——更换 key 后，旧的 SMTP 密码密文将无法解密，需要重新填写密码。
      # SMTP_ENCRYPTION_KEY: change-this-to-a-generated-base64-32-byte-key
    volumes:
      # 持久化工单图片附件；不要挂载到 /app/public 之下，避免变成公开静态目录。
      - ../data/ticket-uploads:/app/data/ticket-uploads
    healthcheck:
      # 应用自带 /api/health，用它判断容器是否真正可用（而不只是进程存活）。
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5478/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      # 首次启动要跑数据库迁移，给足启动时间，避免迁移期间被误判为不健康。
      start_period: 60s

  # PostgreSQL 数据库服务。
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: transithub
      POSTGRES_USER: transithub
      # 必须修改，并同步到 app.environment.DATABASE_URL 中。
      POSTGRES_PASSWORD: change-this-db-password
    volumes:
      # 持久化数据库数据。
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transithub -d transithub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 服务：用于后台会话、缓存和定时刷新任务。
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 开启 AOF 持久化。仪表盘 admin 会话存放在 Redis，默认配置下容器重启会丢失
    # 全部会话，导致所有工作区都需要重新登录上游 admin 账号。
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      # 持久化 Redis 数据。
      - ../data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
